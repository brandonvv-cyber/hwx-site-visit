<style>
/* Field app: giant blocks, one question per screen, system fonts only so it works with no signal. */
:root {
  --bg: #eef3f5; --surface: #ffffff; --ink: #12262e; --muted: #53686f; --head: #0b4f6c; --head-ink: #ffffff;
  --line: #9db3bb; --pick: #fff176; --pick-ink: #12262e; --on: #0b4f6c; --on-ink: #ffffff; --done: #2e7d4f; --done-bg: #d5ecdc;
  --hint-bg: #dcecf9; --hint-ink: #0d4799; --warn: #b3261e; --warn-bg: #fde7e4; --disabled-bg: #dfe5e8;
  --f-head: 'Avenir Next Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root { --bg: #0e1a1f; --surface: #172830; --ink: #eaf2f5; --muted: #9db3bb; --line: #3d5963; --pick: #4a4300; --pick-ink: #fff6a8; --on: #7cc4e0; --on-ink: #06222d; --done: #7fd19c; --done-bg: #1c3a2a; --hint-bg: #16324a; --hint-ink: #a9cdf7; --warn: #ff8a80; --warn-bg: #3a1c1a; --disabled-bg: #22343c; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 20px; line-height: 1.3;
  padding: 0 max(16px, env(safe-area-inset-right)) 150px max(16px, env(safe-area-inset-left)); -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; color: inherit; cursor: pointer; }
.top { position: sticky; top: 0; z-index: 5; background: var(--head); color: var(--head-ink); margin: 0 calc(-1 * max(16px, env(safe-area-inset-right))) 0 calc(-1 * max(16px, env(safe-area-inset-left)));
  padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 12px; min-height: 68px; }
.top h1 { font-family: var(--f-head); font-weight: 700; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; margin: 0; flex: 1; min-width: 0; line-height: 1.05; }
.top .back { background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.6); color: #fff; border-radius: 10px; min-height: 52px; padding: 0 16px; font-weight: 700; font-size: 20px; flex: none; }
.pill { flex: none; font-size: 15px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.55); max-width: 42vw; text-align: center; line-height: 1.1; }
.pill.wait { background: #ffd54f; color: #3a2d00; border-color: #ffd54f; }
.bar { height: 10px; background: var(--disabled-bg); border-radius: 5px; overflow: hidden; margin: 14px 0 4px; }
.bar > i { display: block; height: 100%; background: var(--done); }
.count { color: var(--muted); font-weight: 600; font-size: 18px; margin-bottom: 8px; }
.q { font-family: var(--f-head); font-weight: 700; font-size: 38px; line-height: 1.05; margin: 10px 0 14px; }
.sec { font-family: var(--f-head); font-weight: 600; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
.hint { background: var(--hint-bg); color: var(--hint-ink); border-radius: 12px; padding: 14px 16px; font-size: 19px; font-weight: 500; margin-bottom: 16px; }
.hint b { text-transform: uppercase; letter-spacing: .05em; font-size: 15px; display: block; margin-bottom: 2px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 14px 16px; font-size: 19px; font-weight: 600; margin: 14px 0; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { width: 100%; min-height: 78px; text-align: left; padding: 14px 18px; font-size: 24px; font-weight: 700; line-height: 1.15; background: var(--pick); color: var(--pick-ink);
  border: 3px solid var(--line); border-radius: 14px; display: flex; align-items: center; gap: 14px; }
.opt .box { flex: none; width: 34px; height: 34px; border: 3px solid currentColor; border-radius: 8px; display: grid; place-items: center; font-size: 26px; line-height: 1; }
.opt.single .box { border-radius: 50%; }
.opt.on { background: var(--on); color: var(--on-ink); border-color: var(--on); }
.opt.on .box::after { content: "\2713"; }
.nr { width: 100%; margin-top: 14px; min-height: 64px; font: inherit; font-size: 20px; font-weight: 700; padding: 12px 16px; border: 3px dashed var(--line); border-radius: 12px; background: transparent; color: var(--ink); text-align: center; }
.nr.on { border-style: solid; background: var(--on); color: var(--on-ink); border-color: var(--on); }
select.write { min-height: 78px; font-size: 28px; font-weight: 700; }
.other, .write { width: 100%; font: inherit; font-size: 22px; padding: 14px; border: 3px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); min-height: 120px; margin-top: 12px; }
.num { min-height: 78px; font-size: 32px; font-weight: 700; }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 3px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: flex; gap: 12px; }
.btn { flex: 1; min-height: 78px; font-size: 26px; font-weight: 700; border-radius: 14px; border: 3px solid var(--head); background: var(--head); color: var(--head-ink); font-family: var(--f-head); text-transform: uppercase; letter-spacing: .04em; }
.btn.alt { background: var(--surface); color: var(--head); flex: .55; }
.phrow { display: flex; gap: 12px; margin-top: 16px; }
.btn.photo { background: #e65100; color: #ffffff; border-color: #bf360c; flex: 1; min-height: 78px; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 0 #bf360c; }
.btn.photo.album { background: #1565c0; border-color: #0d47a1; box-shadow: 0 4px 0 #0d47a1; }
.btn.photo.video { background: #2e7d32; border-color: #1b5e20; box-shadow: 0 4px 0 #1b5e20; }
.btn.photo svg { width: 34px; height: 34px; flex: none; fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.photo:active { transform: translateY(3px); box-shadow: 0 1px 0 #bf360c; }
.other.short { min-height: 84px; }
.btn[disabled] { background: var(--disabled-bg); color: var(--muted); border-color: var(--line); }
.block { width: 100%; min-height: 128px; text-align: left; border: 4px solid var(--head); border-radius: 18px; background: var(--surface); padding: 16px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.block .t { flex: 1; min-width: 0; }
.block .t b { display: block; font-family: var(--f-head); font-size: 36px; line-height: 1.02; text-transform: uppercase; letter-spacing: .02em; }
.block .t span { display: block; font-size: 20px; color: var(--muted); font-weight: 600; margin-top: 6px; }
.block .go { flex: none; font-family: var(--f-head); font-size: 54px; color: var(--head); line-height: 1; }
.block.done { border-color: var(--done); background: var(--done-bg); }
.block.done .go { color: var(--done); }
.block.start { background: var(--head); color: var(--head-ink); }
.block.start .t span, .block.start .go { color: var(--head-ink); }
.small { background: none; border: 0; color: var(--muted); font-size: 18px; text-decoration: underline; padding: 14px 0; min-height: 52px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.kv { display: grid; gap: 6px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 14px 0; }
.kv div { display: flex; justify-content: space-between; gap: 12px; font-size: 18px; }
.kv span { color: var(--muted); }
.kv b { text-align: right; }
.sync { background: var(--surface); border: 3px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 14px 0; }
.sync.wait { border-color: #e0a800; background: #fff6d6; color: #3a2d00; }
.sync b { display: block; font-size: 22px; }
.sync .btn { margin-top: 12px; width: 100%; flex: none; min-height: 68px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.thumbs img { width: 76px; height: 76px; object-fit: cover; border-radius: 10px; border: 3px solid var(--line); }
.list { margin: 0; padding-left: 22px; } .list li { margin: 6px 0; }
.ver { color: var(--muted); font-size: 14px; text-align: center; margin: 30px 0 10px; }
input[type=file] { display: none; }
</style>

<body>
<div id="app"></div>
<div id="foot" class="foot" hidden></div>
<input type="file" id="cam" accept="image/*" capture="environment">
<input type="file" id="vcam" accept="video/*" capture="environment">
<input type="file" id="lib" accept="image/*,video/*" multiple>
<script>
"use strict";
const APP_VERSION = "1.9";
const API = "https://script.google.com/macros/s/AKfycbwdahF6EsK6Xdo8Wy888LWhHfXSJZK7zliP-njXFUaqZr4txa3Q9MSPYqgxzC-8tLUMBg/exec";
const OTHER = "Other (write it in the box below)";
const EQ_REPAIR = ["Acrylic spa","Concrete spa","Pool equipment","Sauna or steam room","Water feature","Borehole or water treatment","Heat pump"];
const EQ_NEW = ["Acrylic spa","Concrete spa","Sauna","Steam room","Water feature","Domestic pool","Water reticulation","Borehole or water treatment","Deck","Heat pump","Commercial pool","Natural pool (pilot only)"];
const REPAIR_TAB = {"Acrylic spa":"9a Spa repair","Concrete spa":"9a Spa repair","Pool equipment":"9b Pool repair","Heat pump":"9b Pool repair","Sauna or steam room":"9d Sauna and steam repair","Water feature":"9e Water feature repair","Borehole or water treatment":"9c Water treatment repair"};
const NEW_TAB = {"Acrylic spa":"2 Spa","Concrete spa":"2 Spa","Sauna":"3 Sauna","Steam room":"4 Steam","Water feature":"5 Water feature","Domestic pool":"6 Pool","Water reticulation":"7 Reticulation","Borehole or water treatment":"8 Borehole","Deck":"10 Deck","Heat pump":"13 Heat pump","Commercial pool":"11 Commercial pool","Natural pool (pilot only)":"12 Natural pool"};
const ROUTINE = "Routine visit or inspection";
const MAINT = "Pool or spa maintenance";
const KINDS = ["Repair quote","New installation quote","Both", ROUTINE, MAINT];
const ROUTINE_TABS = ["16 Plant setup","17 Plant inspection"];
const MAINT_TABS = ["18 Pool or spa profile","19 Maintenance visit"];
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
let SCOPE = new Map();   // code -> "r" (per visit date), "c" (per client) or "cv" (per client and visit date); other codes are plain
let CTX = { tab: "", inst: 1 }, TABOF = new Map();   // CTX: which copy ("water feature 2") of a tab the screen is working on; TABOF: question code -> tab
function K(code) {
  const s = SCOPE.get(code); let key;
  if (!s) key = code;
  else if (s === "r") key = code + "@" + S.visit;
  else { const c = S.client || "NOCLIENT"; key = s === "c" ? code + "@" + c : code + "@" + c + "@" + S.visit; }
  return (CTX.inst > 1 && TABOF.get(code) === CTX.tab) ? key + "#" + CTX.inst : key;   // 2nd, 3rd ... copy of a tab: code#2, code#3
}
let CLIENTS = [];        // maintenance clients (one per pool or spa) from the office list

/* ---------- tiny IndexedDB wrapper ---------- */
let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open("hwx-visit", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("kv"); d.createObjectStore("photos", { keyPath: "id", autoIncrement: true }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, mode); const out = fn(t.objectStore(store)); t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error); });
}
const kvGet = k => tx("kv", "readonly", s => s.get(k));
const kvPut = (k, v) => tx("kv", "readwrite", s => s.put(v, k));
const phAll = () => tx("photos", "readonly", s => s.getAll());
const phAdd = o => tx("photos", "readwrite", s => s.add(o));
const phPut = o => tx("photos", "readwrite", s => s.put(o));
const kvDel = k => tx("kv", "readwrite", s => s.delete(k));
let TECH = "";               // technician key (from the technician link): lists the jobs and makes walk-in jobs

/* ---------- state ---------- */
let Q = null;               // questions {version, tabs}
let J = null;               // current job {id, token, client, address, folder_name, ans:{code:{v,o,ts,tab,q,dirty}}}
let S = { view: "boot", tab: "", cur: "", pickStage: "repair", visit: today(), client: "" };
let photos = [];            // photo records for this job (blobs)
let syncing = false, lastErr = "", lastOk = "";
const app = document.getElementById("app"), foot = document.getElementById("foot");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const params = new URLSearchParams(location.search);
const deviceId = (() => { let d = localStorage.getItem("hwx-device"); if (!d) { d = "dev-" + Math.random().toString(36).slice(2, 8); try { localStorage.setItem("hwx-device", d); } catch (e) {} } return d; })();

/* ---------- answers ---------- */
function ansOf(code) { return J.ans[K(code)]; }
function val(code) { const a = ansOf(code); return a ? a.v : undefined; }
const NR = "Not relevant to this job";
function isNR(code) { const v = val(code); return v === NR || (Array.isArray(v) && v.length === 1 && v[0] === NR); }
function has(code) { const v = val(code); return Array.isArray(v) ? v.length > 0 : (v !== undefined && v !== null && String(v).trim() !== ""); }
function flat(code) {
  if (code === "START-02" && startKind() === "New installation quote") return "";
  if (code === "START-03" && startKind() === "Repair quote") return "";
  const v = val(code); return (Array.isArray(v) ? v.join(" ") : (v || "")).toLowerCase(); }
let saveTimer;
function setAns(code, v, extra) {
  const it = findItem(code) || {}, key = K(code);
  const prev = J.ans[key] || {};
  J.ans[key] = Object.assign({ o: prev.o || "", tab: it.tab || prev.tab || "", q: it.q || prev.q || "" }, extra || {}, { v: v, ts: new Date().toISOString(), dirty: true });
  persist(); scheduleSync();
}
function setOther(code, text) { const it = findItem(code) || {}, key = K(code); const a = J.ans[key] || { v: "", tab: it.tab || "", q: it.q || "" }; a.o = text; a.ts = new Date().toISOString(); a.dirty = true; J.ans[key] = a; persist(); scheduleSync(); }
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(() => kvPut("job:" + J.id, J).catch(() => {}), 150); }
function findItem(code) { if (!Q) return null; for (const k in Q.tabs) for (const it of Q.tabs[k].items) if (it.code === code) return Object.assign({ tab: k }, it); return null; }

/* ---------- job flow ---------- */
function startKind() { return val("START-01") || ""; }
function startList(c) { const v = val(c); return Array.isArray(v) ? v : []; }
function jobTabs() {
  if (startKind() === ROUTINE) return ROUTINE_TABS.filter(k => Q.tabs[k]);
  if (startKind() === MAINT) return MAINT_TABS.filter(k => Q.tabs[k]);
  const t = ["1 Site"]; const add = k => { if (k && !t.includes(k)) t.push(k); };
  if (startKind() !== "New installation quote") startList("START-02").forEach(e => add(REPAIR_TAB[e]));
  if (startKind() !== "Repair quote") startList("START-03").forEach(e => add(NEW_TAB[e]));
  t.push("14 Measurements", "15 Time estimate");
  return t.filter(k => Q.tabs[k]);
}
function visible(it) {
  if (!it.code) return false; if (!it.cond) return true;
  return it.cond.split(";").some(cl => { const [c, kws] = cl.split("~"); const a = flat(c); return kws.split("/").some(k => a.includes(k.toLowerCase())); });
}
function qList(tab) { return Q.tabs[tab].items.filter(visible); }
function progress(tab) { const l = qList(tab); return { done: l.filter(i => has(i.code)).length, total: l.length }; }
/* More than one feature (two water features, two spas, two boreholes): a tab can be added again. Answers of copy 2 are saved as code#2. */
const canMulti = t => !/^(1 Site|15 Time|16 |17 |18 |19 )/.test(t);
function instCount(tab) { let n = (J.inst && J.inst[tab]) || 1; for (const k in J.ans) { const m = /#(\d+)$/.exec(k); if (m && TABOF.get(k.slice(0, m.index).split("@")[0]) === tab) n = Math.max(n, +m[1]); } return n; }
function inCtx(tab, inst, fn) { const o = CTX; CTX = { tab, inst }; try { return fn(); } finally { CTX = o; } }
function secOf(tab, code) { let s = ""; for (const it of Q.tabs[tab].items) { if (it.sec) s = it.sec; if (it.code === code) return s; } return s; }

/* ---------- sync ---------- */
function pending() {
  const a = Object.values(J.ans).filter(x => x.dirty).length;
  const p = photos.filter(x => !x.sent).length;
  return { a, p, n: a + p };
}
let syncTimer;
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(false), 2500); refreshStatus(); }
async function post(body, ms) {
  const c = new AbortController(); const to = setTimeout(() => c.abort(), ms || 30000);
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ job: J.id, t: J.token, device: deviceId }, body)), signal: c.signal });
    return await r.json();
  } finally { clearTimeout(to); }
}
async function sync(manual) {
  if (J && J.pending && !syncing) await promote();
  if (syncing || !J || !J.token) return;
  syncing = true; lastErr = ""; refreshStatus();
  try {
    // 1) answers
    const dirty = Object.entries(J.ans).filter(([, a]) => a.dirty);
    if (dirty.length) {
      const sent = dirty.map(([code, a]) => ({ code, a, ts: a.ts }));
      const items = dirty.map(([code, a]) => ({ code, answer: Array.isArray(a.v) ? a.v.join("; ") : a.v, other: a.o || "", tab: a.tab || "", q: a.q || "", ts: a.ts }));
      const r = await post({ action: "answers", items }, 30000);
      if (!r.ok) throw new Error(r.error || "server said no");
      sent.forEach(s => { const cur = J.ans[s.code]; if (cur && cur.ts === s.ts) cur.dirty = false; });
      persist();
    }
    // 2) photos, one at a time
    const todo = photos.filter(x => !x.sent).sort((a, b) => (a.video ? 1 : 0) - (b.video ? 1 : 0));
    for (const p of todo) {
      if (p.video) { p.driveId = await sendVideo(p); vprog = 0; }
      else {
        const b64 = await blobToB64(p.blob);
        const r = await post({ action: "photo", code: p.code, name: p.name, mime: "image/jpeg", b64, ts: p.ts }, 90000);
        if (!r.ok) throw new Error(r.error || "photo failed");
        p.driveId = r.id;
      }
      p.sent = true; await phPut(p); refreshStatus();
    }
    lastOk = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    lastErr = (e && e.name === "AbortError") ? "Slow or no signal" : "No signal or server busy";
  } finally { syncing = false; refreshStatus(); }
}
let vprog = 0;
async function sendVideo(p) {
  // The script opens a Drive upload session; the phone then sends the video straight to Drive in 8 MB pieces.
  const s = await post({ action: "videoStart", code: p.code, name: p.name, mime: p.mime || "video/mp4", size: p.blob.size, origin: location.origin }, 30000);
  if (!s.ok) throw new Error(s.error || "video start failed");
  const size = p.blob.size, CH = 8 * 1024 * 1024; let off = 0, fileId = "";
  while (off < size) {
    const end = Math.min(off + CH, size);
    const r = await fetch(s.url, { method: "PUT", headers: { "Content-Range": "bytes " + off + "-" + (end - 1) + "/" + size }, body: p.blob.slice(off, end) });
    if (r.status === 308) { off = end; vprog = Math.round(off * 100 / size); refreshStatus(); continue; }
    if (r.status === 200 || r.status === 201) { const d = await r.json(); fileId = d.id; off = size; break; }
    throw new Error("video upload " + r.status);
  }
  const done = await post({ action: "videoDone", code: p.code, name: s.name, id: fileId, ts: p.ts }, 30000);
  if (!done.ok) throw new Error(done.error || "video log failed");
  return fileId;
}
function blobToB64(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); }); }
async function pull() {
  if (!J || !J.token) return;
  try {
    const r = await fetch(API + "?action=job&job=" + encodeURIComponent(J.id) + "&t=" + encodeURIComponent(J.token) + (startKind() === MAINT && S.client ? "&client=" + encodeURIComponent(S.client) + "&date=" + encodeURIComponent(S.visit) : ""));
    const d = await r.json(); if (!d.ok) return;
    J.client = d.job.client; J.address = d.job.address; J.folder_name = d.job.folder_name;
    d.answers.forEach(sa => {
      const mine = J.ans[sa.code];
      if (!mine || (!mine.dirty && new Date(sa.ts) > new Date(mine.ts))) {
        const base = String(sa.code).split("@")[0].split("#")[0];
        const it = findItem(base) || {};
        const multi = it.multi || ["START-02", "START-03"].includes(base);
        J.ans[sa.code] = { v: multi ? String(sa.answer || "").split("; ").filter(Boolean) : sa.answer, o: sa.other || "", tab: it.tab || "", q: it.q || "", ts: sa.ts, dirty: false };
      }
    });
    persist();
  } catch (e) { /* offline is fine */ }
}
function refreshStatus() {
  const el = document.getElementById("pill"); if (!el || !J) return;
  const p = pending();
  el.textContent = syncing ? "Sending..." : (p.n ? p.n + " waiting" : "All sent");

    body = `<select class="write dd" id="numsel"><option value="">Choose from the list</option>${it.opts.map(o => `<option value="${esc(o)}" ${o === cur ? "selected" : ""}>${esc(o)}</option>`).join("")}<option value="__other" ${typing ? "selected" : ""}>Other (type a number)</option></select>` +
      (typing ? `<input class="write num" id="numin" inputmode="decimal" placeholder="Type the number" value="${esc(inList ? "" : cur)}">` : "") +
      `<textarea class="other short" id="other" placeholder="Note (optional)">${esc((ansOf(it.code) || {}).o || "")}</textarea>`;
  } else if (it.kind === "num") body = `<input class="write num" id="numin" inputmode="decimal" placeholder="Type a number" value="${esc(a || "")}"><textarea class="other short" id="other" placeholder="Note (optional)">${esc((ansOf(it.code) || {}).o || "")}</textarea>`;
  else body = `<textarea class="write" id="textin" placeholder="Type here (keep it short)">${esc(a || "")}</textarea>`;
  app.innerHTML = hdr(Q.tabs[tab].title + (S.inst > 1 ? " " + S.inst : ""), "hub", true) +
    `<div class="bar"><i style="width:${Math.round(p.done * 100 / p.total)}%"></i></div>
     <div class="count">Question ${idx + 1} of ${list.length}${it.multi ? " &middot; pick all that apply" : ""}</div>
     ${secOf(tab, it.code) ? `<div class="sec">${esc(secOf(tab, it.code))}</div>` : ""}
     <div class="q">${esc(it.q)}</div><div class="hint"><b>What to look for</b>${esc(it.hint)}</div>${body}${it.kind === "advice" ? "" : `<button class="nr ${nrOn ? "on" : ""}" data-nr="1">${nrOn ? "&#10003; Marked not relevant to this job (tap to undo)" : "Not relevant to this job"}</button>`}${it.kind === "advice" ? "" : photoUi(K(it.code))}`;
  const last = idx === list.length - 1;
  setFoot(`<button class="btn alt" data-act="prev" ${idx === 0 ? "disabled" : ""}>Back</button><button class="btn" data-act="next">${last ? "Finish" : "Next"}</button>`); refreshStatus();
}
function vGen() {
  app.innerHTML = hdr("Extra photos", "hub", true) + `<div class="q">Photos of anything else</div><div class="hint"><b>What to look for</b>Take photos of the work area, the access route, the DB board and the equipment space.</div>${photoUi("GEN")}`;
  setFoot(`<button class="btn" data-act="hub">Back to jobs</button>`); refreshStatus();
}
function vDone() {
  const missing = [], notSure = [];
  jobTabs().forEach(t => { const n = instCount(t); for (let k = 1; k <= n; k++) inCtx(t, k, () => qList(t).forEach(i => { const tt = n > 1 ? t + " " + k : t; if (!has(i.code)) missing.push({ t: tt, tb: t, i }); else if (/not sure/i.test(flat(i.code))) notSure.push({ t: tt, tb: t, i }); })); });
  app.innerHTML = hdr("Before you leave", "hub", true) + `<div class="q">${missing.length ? missing.length + " questions not answered" : "Everything is answered"}</div>
    ${syncHtml()}
    ${missing.length ? `<ul class="list">${missing.slice(0, 40).map(m => `<li><b>${esc(Q.tabs[m.tb].title)}${m.t !== m.tb ? m.t.slice(m.tb.length) : ""}:</b> ${esc(m.i.q)}</li>`).join("")}${missing.length > 40 ? `<li>and ${missing.length - 40} more</li>` : ""}</ul>` : ""}
    ${notSure.length ? `<div class="q" style="font-size:28px">Marked not sure: ${notSure.length}</div><ul class="list">${notSure.slice(0, 20).map(m => `<li>${esc(m.i.q)}</li>`).join("")}</ul>` : ""}
    <div class="note">Do not leave site until the box above says Everything is sent. Get a signal and tap Send now.</div>`;
  setFoot(`<button class="btn" data-act="hub">Back to jobs</button>`); refreshStatus();
}

/* ---------- events ---------- */
function advance(dir) {
  const list = qList(S.tab); const idx = list.findIndex(i => i.code === S.cur);
  if (dir > 0) { if (idx >= list.length - 1) { nav("hub"); return; } S.cur = list[idx + 1].code; } else if (idx > 0) S.cur = list[idx - 1].code;
  render(); window.scrollTo(0, 0);
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.nr) { const it = qList(S.tab).find(i => i.code === S.cur); if (!it) return; if (isNR(it.code)) { setAns(it.code, ""); render(); } else { setAns(it.code, NR); render(); setTimeout(() => advance(1), 260); } return; }
  if (d.open) { await openJob(d.open); return; }
  if (d.client) { S.client = d.client; render(); await pull(); render(); return; }
  if (d.kind) { setAns("START-01", d.kind, { tab: "START", q: "Repair, new installation or both" }); if (d.kind === MAINT) { await loadClients(); nav("hub"); return; } if (d.kind === ROUTINE) { nav("hub"); return; } S.pickStage = d.kind === "New installation quote" ? "new" : "repair"; nav("pick"); return; }
  if (d.eq) {
    const code = S.pickStage === "repair" ? "START-02" : "START-03"; const arr = startList(code).slice(); const i = arr.indexOf(d.eq);
    if (i >= 0) arr.splice(i, 1); else arr.push(d.eq);
    setAns(code, arr, { tab: "START", q: S.pickStage === "repair" ? "What are we repairing" : "What are we quoting on" }); const y = scrollY; render(); scrollTo(0, y); return;
  }
  if (d.tab) { S.tab = d.tab; S.inst = +d.inst || 1; CTX = { tab: S.tab, inst: S.inst }; const l = qList(S.tab); const f = l.find(i => !has(i.code)) || l[0]; S.cur = f ? f.code : ""; nav("q"); return; }
  if (d.addinst) { const t = d.addinst; J.inst = J.inst || {}; J.inst[t] = instCount(t) + 1; persist(); S.tab = t; S.inst = J.inst[t]; CTX = { tab: t, inst: S.inst }; const l = qList(t); S.cur = l[0] ? l[0].code : ""; nav("q"); return; }
  if (d.photo) { photoFor = d.photo; document.getElementById("cam").click(); return; }
  if (d.album) { photoFor = d.album; document.getElementById("lib").click(); return; }
  if (d.video) { photoFor = d.video; document.getElementById("vcam").click(); return; }
  if (d.opt !== undefined) {
    const it = qList(S.tab).find(i => i.code === S.cur), o = d.opt;
    if (it.multi) { const arr = (Array.isArray(val(it.code)) ? val(it.code) : []).slice(); const i = arr.indexOf(o); if (i >= 0) arr.splice(i, 1); else arr.push(o); setAns(it.code, arr); const y = scrollY; render(); scrollTo(0, y); }
    else { setAns(it.code, o); render(); if (o !== OTHER) setTimeout(() => advance(1), 260); }
    return;
  }
  const act = d.act; if (!act) return;
  if (act === "getjobs") { S.jobsMsg = "Downloading..."; vJobs(); const r = await loadMyJobs(); S.jobsMsg = r === "ok" ? "Jobs downloaded." : (r === "offline" ? "No signal. Try again when you have signal." : r); vJobs(); return; }
  if (act === "newjob") { nav("newjob"); return; }
  if (act === "makejob") {
    const cl = (document.getElementById("nj_client").value || "").trim(), ad = (document.getElementById("nj_addr").value || "").trim();
    if (cl.length + ad.length < 4) { alert("Type the client name and the street address."); return; }
    const id = "NEW-" + today().replace(/-/g, "") + "-" + Math.random().toString(36).slice(2, 6);
    const j = { id, token: "", client: cl, address: ad || cl, folder_name: "", ans: {}, pending: { client: cl, address: ad } };
    await kvPut("job:" + id, j); const keys = (await kvGet("jobs")) || []; keys.push(id); await kvPut("jobs", keys);
    J = j; photos = []; S.view = "kind"; render(); sync(false); return;
  }
  if (act === "clients") { S.client = ""; nav("hub"); }
  else if (act === "kind") nav("kind"); else if (act === "hub") nav("hub"); else if (act === "finish") nav("done"); else if (act === "gen") nav("gen");
  else if (act === "jobsback") { S.view = "jobs"; history.replaceState(null, "", location.pathname); render(); }
  else if (act === "pickNext") { if (S.pickStage === "repair" && startKind() === "Both") { S.pickStage = "new"; nav("pick"); } else nav("hub"); }
  else if (act === "next") advance(1); else if (act === "prev") advance(-1);
  else if (act === "send") { await sync(true); }
});
document.addEventListener("change", e => {
  const t = e.target; if (t.id !== "numsel") return;
  if (t.value === "__other") { S.ddOther = S.cur; render(); return; }
  S.ddOther = ""; setAns(S.cur, t.value); render();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "jsearch") { S.jsearch = t.value; jobRowsHtml(t.value).then(r => { const el = document.getElementById("jlist"); if (el) el.innerHTML = r.html; }); }
  else if (t.id === "csearch") { const el = document.getElementById("clist"); if (el) el.innerHTML = clientRows(t.value); }
  else if (t.id === "other") setOther(S.cur, t.value);
  else if (t.id === "textin" || t.id === "numin") setAns(S.cur, t.value);
});
for (const id of ["cam", "lib", "vcam"]) document.getElementById(id).addEventListener("change", e => { const f = Array.from(e.target.files); e.target.value = ""; if (f.length) addPhotoFiles(f); });
window.addEventListener("online", () => sync(false));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (S.visit !== today()) { S.visit = today(); if (J && S.view === "hub") render(); } sync(false); } });

/* ---------- boot ---------- */
async function loadQuestions() {
  try { const r = await fetch("questions.json", { cache: "no-cache" }); if (r.ok) { Q = await r.json(); return; } } catch (e) {}
  const r2 = await fetch("questions.json"); Q = await r2.json();
}
/* Options that technicians wrote under "Other" and the office approved: the backend serves them per question code and they are added to the list just above "Other". */
let EXTRA = {};
function applyExtra() {
  if (!Q) return;
  for (const k in Q.tabs) for (const it of Q.tabs[k].items) {
    if (!it.code || it.kind !== "pick" || !EXTRA[it.code]) continue;
    if (!it._o) it._o = it.opts.slice();
    const add = EXTRA[it.code].filter(x => !it._o.includes(x)), i = it._o.findIndex(o => /^other/i.test(o));
    it.opts = i < 0 ? it._o.concat(add) : it._o.slice(0, i).concat(add, it._o.slice(i));
  }
}
async function loadExtra() {
  try { const r = await fetch(API + "?action=options&job=" + encodeURIComponent(J.token ? J.id : "TECH-001") + "&t=" + encodeURIComponent(J.token || TECH)); const d = await r.json(); if (d.ok) { EXTRA = d.options || {}; await kvPut("extraopts", EXTRA); } } catch (e) { /* offline: keep the saved list */ }
  applyExtra();
}
async function openJob(id, token) {
  let j = await kvGet("job:" + id);
  if (!j) j = { id, token: token || "", client: "", address: "", folder_name: "", ans: {} };
  if (token && j.token !== token) j.token = token;
  J = j;
  photos = (await phAll()).filter(p => p.job === id);
  const keys = (await kvGet("jobs")) || []; if (!keys.includes(id)) { keys.push(id); await kvPut("jobs", keys); }
  await kvPut("job:" + id, J);
  S.view = startKind() ? "hub" : "kind"; render();
  await pull(); if (S.view === "kind" && startKind()) S.view = "hub";
  if (startKind() === MAINT) await loadClients();
  await loadExtra();
  render(); sync(false);
}
(async function boot() {
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try { await loadQuestions(); SCOPE = new Map(); TABOF = new Map(); for (const k in Q.tabs) Q.tabs[k].items.forEach(i => { if (i.code) TABOF.set(i.code, k); }); for (const k in Q.tabs) { const sc = Q.tabs[k].rep ? "r" : (Q.tabs[k].scope === "client" ? "c" : (Q.tabs[k].scope === "clientvisit" ? "cv" : "")); if (sc) Q.tabs[k].items.forEach(i => { if (i.code) SCOPE.set(i.code, sc); }); } } catch (e) { app.innerHTML = hdr("HWX Site Visit") + `<div class="note">Could not load the questions. Open the link once with signal.</div>`; return; }
  try { EXTRA = (await kvGet("extraopts")) || {}; applyExtra(); } catch (e) {}
  try { const tk = params.get("tech"); if (tk) { await kvPut("tech", tk); params.delete("tech"); history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params.toString() : "")); } TECH = (await kvGet("tech")) || ""; } catch (e) {}
  const job = params.get("job"), t = params.get("t");
  if (job) await openJob(job, t); else { S.view = "jobs"; render(); }
  if (TECH) loadMyJobs().then(r => { S.jobsMsg = r === "ok" ? "Jobs list is up to date." : (r === "offline" ? "No signal: showing the jobs saved on this phone." : r); if (S.view === "jobs") vJobs(); });
  if ("serviceWorker" in navigator) {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && !window.__reloaded) { window.__reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(() => {});
  }
})();
</script>
