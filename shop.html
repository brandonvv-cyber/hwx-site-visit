<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HWX Shop Counter</title>
<link rel="manifest" href="shop.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0b4f6c">
<style>
/* Shop counter: same look as the technician app, thinner skin (one form per screen, the spec engine does the sums). */
:root {
  --bg: #eef3f5; --surface: #ffffff; --ink: #12262e; --muted: #53686f; --head: #0b4f6c; --head-ink: #ffffff;
  --line: #9db3bb; --pick: #fff176; --pick-ink: #12262e; --on: #0b4f6c; --on-ink: #ffffff; --done: #2e7d4f; --done-bg: #d5ecdc;
  --hint-bg: #dcecf9; --hint-ink: #0d4799; --warn: #b3261e; --warn-bg: #fde7e4; --disabled-bg: #dfe5e8;
  --f-head: 'Avenir Next Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root { --bg: #0e1a1f; --surface: #172830; --ink: #eaf2f5; --muted: #9db3bb; --line: #3d5963; --pick: #4a4300; --pick-ink: #fff6a8; --on: #7cc4e0; --on-ink: #06222d; --done: #7fd19c; --done-bg: #1c3a2a; --hint-bg: #16324a; --hint-ink: #a9cdf7; --warn: #ff8a80; --warn-bg: #3a1c1a; --disabled-bg: #22343c; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 19px; line-height: 1.3; padding: 0 max(16px, env(safe-area-inset-right)) 150px max(16px, env(safe-area-inset-left)); }
button { font-family: inherit; color: inherit; cursor: pointer; }
.top { position: sticky; top: 0; z-index: 5; background: var(--head); color: var(--head-ink); margin: 0 calc(-1 * max(16px, env(safe-area-inset-right))); padding: 10px max(16px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 12px; min-height: 64px; }
.top h1 { font-family: var(--f-head); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; flex: 1; min-width: 0; line-height: 1.05; }
.top .back { background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.6); color: #fff; border-radius: 10px; min-height: 48px; padding: 0 14px; font-weight: 700; font-size: 18px; }
.wrap { max-width: 980px; margin: 0 auto; }
.q { font-family: var(--f-head); font-weight: 700; font-size: 32px; line-height: 1.05; margin: 14px 0 12px; }
.sec { font-family: var(--f-head); font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; color: var(--head); margin: 22px 0 8px; }
.hint { background: var(--hint-bg); color: var(--hint-ink); border-radius: 12px; padding: 12px 14px; font-size: 17px; font-weight: 500; margin-bottom: 14px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-size: 17px; font-weight: 600; margin: 10px 0; }
.ok { background: var(--done-bg); color: var(--done); border-radius: 12px; padding: 12px 14px; font-size: 17px; font-weight: 600; margin: 10px 0; }
label.f { display: block; font-weight: 700; font-size: 17px; margin: 12px 0 4px; }
input.w, select.w { width: 100%; font: inherit; font-size: 21px; padding: 12px; border: 3px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); min-height: 58px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 56px; padding: 8px 16px; font-size: 19px; font-weight: 700; border: 3px solid var(--line); border-radius: 12px; background: var(--pick); color: var(--pick-ink); }
.chip.on { background: var(--on); color: var(--on-ink); border-color: var(--on); }
.opt { width: 100%; text-align: left; padding: 10px 14px; font-size: 17px; background: var(--surface); border: 3px solid var(--line); border-radius: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin-bottom: 8px; }
.opt b { font-size: 19px; } .opt .p { font-weight: 700; text-align: right; } .opt .s { color: var(--muted); font-size: 15px; }
.opt.on { border-color: var(--on); box-shadow: inset 0 0 0 2px var(--on); background: var(--hint-bg); }
.opt .flag { grid-column: 1 / -1; color: var(--warn); font-weight: 700; font-size: 15px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; font-size: 16px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
td input { width: 70px; font: inherit; padding: 6px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-align: right; }
td .s { color: var(--muted); font-size: 14px; display: block; } td .flag { color: var(--warn); font-weight: 700; font-size: 14px; display: block; }
.tot td { font-weight: 700; border-bottom: 0; }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 3px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { flex: 1; min-width: 150px; max-width: 320px; min-height: 64px; font-size: 21px; font-weight: 700; border-radius: 14px; border: 3px solid var(--head); background: var(--head); color: var(--head-ink); font-family: var(--f-head); text-transform: uppercase; letter-spacing: .04em; }
.btn.alt { background: var(--surface); color: var(--head); }
.btn[disabled] { background: var(--disabled-bg); color: var(--muted); border-color: var(--line); }
.kv { display: grid; gap: 4px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 16px; }
.ver { color: var(--muted); font-size: 14px; text-align: center; margin: 30px 0 10px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 12px 0; }
.tile { text-align: left; min-height: 120px; padding: 14px; border: 3px solid var(--head); border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; position: relative; }
.tile b { font-family: var(--f-head); font-size: 26px; text-transform: uppercase; color: var(--head); line-height: 1.05; } .tile span { color: var(--muted); font-size: 15px; }
.tile i { position: absolute; top: 10px; right: 12px; background: var(--done); color: #fff; font-style: normal; font-weight: 700; font-size: 14px; border-radius: 10px; padding: 2px 8px; }
.prow { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 3px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; } .prow.on { border-color: var(--on); background: var(--hint-bg); }
.prow .pd { flex: 1; min-width: 0; } .prow .pd b { display: block; font-size: 17px; } .prow .s { color: var(--muted); font-size: 14px; display: block; } .prow .flag { color: var(--warn); font-weight: 700; font-size: 14px; display: block; }
.step { display: flex; align-items: center; gap: 8px; } .step button { width: 52px; height: 52px; font-size: 28px; font-weight: 700; border: 3px solid var(--head); border-radius: 12px; background: var(--surface); color: var(--head); } .step b { min-width: 28px; text-align: center; font-size: 22px; }
button.rm { margin-left: 8px; background: none; border: 0; color: var(--warn); text-decoration: underline; font-size: 14px; padding: 4px; }
.wzwrap { max-width: 1240px; }
.wzgrid { display: grid; gap: 14px; }
.wzgrid aside { order: -1; }
@media (min-width: 900px) { .wzgrid { grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; } .wzgrid aside { order: 0; position: sticky; top: 78px; align-self: start; max-height: calc(100vh - 170px); overflow: auto; } }
.stp { border-top: 3px solid var(--line); padding: 14px 0 6px; }
.stp h2 { font-family: var(--f-head); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; color: var(--head); margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
.stp h2 i { font-style: normal; font-size: 16px; color: var(--muted); } .stp h2 em { margin-left: auto; font-style: normal; font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 600; color: var(--muted); text-align: right; }
.stp .sub { font-weight: 700; font-size: 16px; color: var(--muted); margin: 14px 0 6px; }
.tls { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tl { text-align: left; min-height: 84px; padding: 10px 12px; border: 3px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.tl .tn { font-weight: 700; font-size: 19px; line-height: 1.15; } .tl .tb { font-size: 15px; color: var(--muted); line-height: 1.25; }
.tl .swt { height: 26px; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); margin-bottom: 4px; }
.tl.on { border-color: var(--on); box-shadow: inset 0 0 0 2px var(--on); background: var(--hint-bg); }
.wzcard { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
.spc { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 10px; font-size: 16px; } .spc span { color: var(--muted); font-size: 14px; display: block; } .spc b { font-size: 17px; }
.dims { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rd { font-size: 16px; color: var(--muted); margin-top: 8px; } .rd b { color: var(--ink); }
#print { display: none; }
@media print {
  @page { margin: 0; }
  body { background: #fff; color: #000; padding: 0; font-size: 11pt; }
  #app, .foot { display: none !important; }
  #print { display: block; }
  #print.sheet { padding: 14mm; }
  #print.q img { width: 100%; display: block; page-break-after: always; } #print.q img:last-child { page-break-after: auto; }
  #print h2 { margin: 0 0 4px; font-size: 16pt; } #print table { font-size: 10pt; } #print th, #print td { border-bottom: 1px solid #999; padding: 4px 6px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="foot" class="foot" hidden></div>
<div id="print"></div>
<script src="spec.js"></script>
<script src="quote.js"></script>
<script src="catdata.js"></script>
<script src="cat.js"></script>
<script src="sauna.js"></script>
<script src="pipe.js"></script>
<script>
"use strict";
const SHOP_VERSION = "1.4";
const API = "https://script.google.com/macros/s/AKfycbwdahF6EsK6Xdo8Wy888LWhHfXSJZK7zliP-njXFUaqZr4txa3Q9MSPYqgxzC-8tLUMBg/exec";
const STAFF = ["Janine", "Alett", "Patience", "Other"];
const app = document.getElementById("app"), foot = document.getElementById("foot");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => "R " + (Math.round(n * 100) / 100).toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let KEY = "", S = null;
function fresh() { return { view: "client", staff: (S && S.staff) || "", client: { name: "", phone: "", address: "", email: "" }, job: null, basket: [], cat: "", q: "", spa: { model: "Atlantic", grade: "B", htc: "HTCB" }, sauna: { L: "", W: "", H: "", glass: "" }, sw: HWXSauna.newDesign(), pw: HWXPipe.newDesign(ls.get("hwx-pipe-rate") || ""), steam: { L: "", W: "", H: "", glass: "" }, zres: null, zmsg: "", inp: { mode: "vol", volumeL: "", len: "", wid: "", depth: "", use: "domestic", turnover: 6, pos: "level", height: "", distance: "", bends: "3-5", weirs: 1, returns: "" }, res: null, pick: {}, qty: {}, stock: null, sageRef: "" }; }
function save() { ls.set("hwx-shop-session", S); }
function setFoot(h) { foot.innerHTML = h; foot.hidden = !h; }
function hdr(t, back) { return `<div class="top">${back ? `<button class="back" data-go="${back}">&#9664; Back</button>` : ""}<h1>${esc(t)}</h1></div>`; }
function nav(v) { S.view = v; save(); render(); window.scrollTo(0, 0); }

function render() {
  if (!KEY) { app.innerHTML = hdr("HWX Shop Counter") + `<div class="wrap"><div class="q">Open the shop link</div><div class="hint">This page needs the shop counter link from Brandon or Joanne (it ends in ?shop=...). Open it once on the counter computer and bookmark it.</div></div>`; setFoot(""); return; }
  if (S.view === "menu") return vMenu();
  if (S.view === "cat") return vCat();
  if (S.view === "spec") return vSpec();
  if (S.view === "list") return vList();
  if (S.view === "quote") return vQuote();
  return vClient();
}

// 1. Client details, 2. folder in Customer quotes / shop app
function vClient() {
  const c = S.client;
  app.innerHTML = hdr("Shop counter: new client", "home") +`<div class="wrap">
    <div class="q">Who is the client?</div>
    <div class="hint">Type the client's details. A folder is made for them under Customer quotes, costings and drawings / shop app. If the house already has a folder there (or a full client folder), that one is used, so there is no duplicate.</div>
    <label class="f">At the counter</label><div class="chips">${STAFF.map(n => `<button class="chip${S.staff === n ? " on" : ""}" data-staff="${n}">${n}</button>`).join("")}</div>
    <label class="f">Client name</label><input class="w" id="c_name" value="${esc(c.name)}" autocomplete="off">
    <label class="f">Phone</label><input class="w" id="c_phone" value="${esc(c.phone)}" inputmode="tel" autocomplete="off">
    <label class="f">Street address and suburb</label><input class="w" id="c_address" value="${esc(c.address)}" autocomplete="off">
    <label class="f">Email (optional)</label><input class="w" id="c_email" value="${esc(c.email)}" inputmode="email" autocomplete="off">
    <div id="cmsg">${S.job ? `<div class="ok">${esc(S.job.existing ? "Existing folder used: " : "New folder made: ")}${esc(S.job.folder_name)} (ref ${esc(S.job.job_id)})</div>` : ""}</div>
    <div class="ver">Shop counter ${SHOP_VERSION}</div></div>`;
  setFoot(`<button class="btn" data-act="mkclient">${S.job ? "Next: what they need" : "Make the folder and go on"}</button>`);
}
async function mkClient() {
  const g = id => document.getElementById(id).value.trim();
  S.client = { name: g("c_name"), phone: g("c_phone"), address: g("c_address"), email: g("c_email") }; save();
  const msg = document.getElementById("cmsg");
  if (!S.client.name || !S.client.address) { msg.innerHTML = `<div class="note">The client name and the address are needed.</div>`; return; }
  if (S.job && S.job.address === S.client.address && S.job.client === S.client.name) return nav("menu");
  msg.innerHTML = `<div class="hint">Checking for an existing folder...</div>`;
  try {
    const r = await shopJob({});
    if (r.ask) return askFolder(r.matches);
    finishJob(r);
  } catch (e) { msg.innerHTML = `<div class="note">Could not make the folder (${esc(e.message)}). Check the internet and try again.</div>`; }
}
async function shopJob(extra) {
  const r = await (await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ job: "SHOP-001", t: KEY, action: "shopjob", client: S.client.name, phone: S.client.phone, address: S.client.address, email: S.client.email, staff: S.staff }, extra)) })).json();
  if (!r.ok) throw new Error(r.error || "server said no");
  return r;
}
function finishJob(r) { S.job = r; save(); vClient(); setTimeout(() => nav("menu"), 900); }
// A folder already exists for this address: never silently reuse it or duplicate it. The staff member chooses.
function askFolder(matches) {
  S.matches = matches; const msg = document.getElementById("cmsg");
  msg.innerHTML = `<div class="note">There is already a folder for this address. Do you want to keep this client's quote in it, or make a separate new folder?</div>` +
    matches.map((m, i) => `<div class="kv"><div><b>${esc(m.name)}</b></div><div class="s">${esc(m.where)}</div><button class="btn" style="max-width:none" data-use="${i}">Use this folder</button></div>`).join("") +
    `<button class="btn alt" style="max-width:none;width:100%" data-newfolder="1">No: make a separate new folder</button>`;
}
async function folderChoice(extra) {
  const msg = document.getElementById("cmsg"); msg.innerHTML = `<div class="hint">Working...</div>`;
  try { finishJob(await shopJob(extra)); } catch (e) { msg.innerHTML = `<div class="note">Could not do that (${esc(e.message)}). Check the internet and try again.</div>`; }
}

// 3. Counter spec screen
function vSpec() {
  const i = S.inp, chip = (k, v, t) => `<button class="chip${String(i[k]) === String(v) ? " on" : ""}" data-k="${k}" data-v="${esc(v)}">${esc(t)}</button>`;
  app.innerHTML = hdr("The pool", "menu") + `<div class="wrap">
    <div class="ok">${esc(S.client.name)} &middot; ${esc(S.client.address)}${S.job ? " &middot; ref " + esc(S.job.job_id) : ""}</div>
    <div class="sec">Water volume</div>
    <div class="chips">${chip("mode", "vol", "I know the litres")}${chip("mode", "dim", "Measure it (length x width x depth)")}</div>
    ${i.mode === "vol" ? `<label class="f">Volume in litres</label><input class="w" id="i_volumeL" inputmode="numeric" value="${esc(i.volumeL)}" placeholder="e.g. 30000">`
      : `<div class="grid3"><div><label class="f">Length (m)</label><input class="w" id="i_len" inputmode="decimal" value="${esc(i.len)}"></div><div><label class="f">Width (m)</label><input class="w" id="i_wid" inputmode="decimal" value="${esc(i.wid)}"></div><div><label class="f">Average depth (m)</label><input class="w" id="i_depth" inputmode="decimal" value="${esc(i.depth)}"></div></div>`}
    <div class="sec">Pool use and turnover</div>
    <div class="chips">${chip("use", "domestic", "Home pool")}${chip("use", "commercial", "Commercial")}</div>
    <label class="f">Turnover (hours to filter all the water once)</label><div class="chips">${[4, 6, 8].map(h => chip("turnover", h, h + " h" + (h === 6 ? " (home)" : h === 4 ? " (commercial)" : ""))).join("")}</div>
    <div class="sec">Where the pump goes (DR-002)</div>
    <label class="f">Pump height from the water surface</label><div class="chips">${chip("pos", "above", "Above the water")}${chip("pos", "level", "At water level")}${chip("pos", "below", "Below the water")}</div>
    ${i.pos !== "level" ? `<label class="f">How many metres ${i.pos === "above" ? "above" : "below"}</label><input class="w" id="i_height" inputmode="decimal" value="${esc(i.height)}">` : ""}
    <label class="f">Distance from the pool to the pump (m)</label><input class="w" id="i_distance" inputmode="decimal" value="${esc(i.distance)}" placeholder="e.g. 8">
    <label class="f">Bends in the pipe from the weir to the pump</label><div class="chips">${Object.keys(HWXSpec.BENDS).map(b => chip("bends", b, b)).join("")}</div>
    <div class="sec">Weirs and returns</div>
    <label class="f">Weirs</label><div class="chips">${[1, 2, 3].map(n => chip("weirs", n, n)).join("")}</div>
    <label class="f">Returns (blank = worked out from the volume)</label><div class="chips">${chip("returns", "", "Auto")}${[1, 2, 3, 4].map(n => chip("returns", n, n)).join("")}</div>
    <div id="smsg"></div></div>`;
  setFoot(`<button class="btn" data-act="calc">Work out the equipment</button>`);
}
function readSpec() { for (const k of ["volumeL", "len", "wid", "depth", "height", "distance"]) { const el = document.getElementById("i_" + k); if (el) S.inp[k] = el.value.trim(); } save(); }
function calc() {
  readSpec(); const i = S.inp;
  const res = HWXSpec.run({ volumeL: i.mode === "vol" ? +i.volumeL : 0, len: +i.len, wid: +i.wid, depth: +i.depth, use: i.use, turnover: +i.turnover, pos: i.pos, height: +i.height, distance: +i.distance, bends: i.bends, weirs: +i.weirs, returns: +i.returns || 0 });
  if (res.error) { document.getElementById("smsg").innerHTML = `<div class="note">${esc(res.error)}</div>`; return; }
  if (!(+i.distance > 0)) { document.getElementById("smsg").innerHTML = `<div class="note">Enter the distance from the pool to the pump.</div>`; return; }
  S.res = res; S.pick = { pump: 0, filter: 0, weir: 0, return: 0, cover: 3 }; S.qty = {}; S.stock = null; nav("list");
}

// 2b. What do they need? One basket for every category (pool, spa, sauna, steam room, water reticulation, water features, anything else)
const uid = () => Math.random().toString(36).slice(2, 8);
function vMenu() {
  const n = c => S.basket.filter(b => b.cat === c).length + (c === "pool" && S.res ? 1 : 0);
  app.innerHTML = hdr("What do they need?", "client") + `<div class="wrap"><div class="ok">${esc(S.client.name)} &middot; ${esc(S.client.address)}${S.job ? " &middot; ref " + esc(S.job.job_id) : ""}</div>
    <div class="hint">Tap a category and add what the client wants. You can mix categories on one quote. When everything is added, tap "See the list and quote".</div>
    <div class="tiles">${HWXCat.CATS.map(c => `<button class="tile" data-cat="${c.key}"><b>${esc(c.title)}</b><span>${esc(c.sub)}</span>${n(c.key) ? `<i>${n(c.key)} added</i>` : ""}</button>`).join("")}</div>
    <div class="ver">Shop counter ${SHOP_VERSION} &middot; Sage prices as of ${esc(HWXCat.asof || "?")} until you tap Refresh stock</div></div>`;
  setFoot(`<button class="btn" data-act="tolist"${S.res || S.basket.length ? "" : " disabled"}>See the list and quote</button>`);
}
function rowFor(code) {
  const m = HWXCat.get(code); if (!m) return "";
  const b = S.basket.find(x => x.code === code && x.cat === S.cat && !x.opt), q = b ? b.qty : 0;

  const blob = HWXQuote.pdf(QP.pages), name = qName(), file = new File([blob], name, { type: "application/pdf" }), d = QP.d, first = (S.client.name || "").split(/\s+/)[0] || "there";
  const text = `Hi ${first}, thank you for visiting Hydroworx. Your quote is attached: total ${HWXQuote.R(d.total)} including VAT, valid until ${d.validUntil}. Call or WhatsApp us on 081 535 9997 with any questions.`;
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Hydroworx quote", text }); m.innerHTML = `<div class="ok">Shared. Check that it reached the client.</div>`; return; } } catch (e) { if (e && e.name === "AbortError") return; }
  downloadBlob(blob, name);
  const wn = waNumber(S.client.phone), wa = "https://wa.me/" + wn + "?text=" + encodeURIComponent(text), mail = "mailto:" + encodeURIComponent(S.client.email || "") + "?subject=" + encodeURIComponent("Your Hydroworx quote") + "&body=" + encodeURIComponent(text.replace("is attached", "is attached as a PDF"));
  m.innerHTML = `<div class="ok">The PDF "${esc(name)}" is downloaded. Send it now and attach that file:<br>${wn ? `<a href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp ${esc(S.client.phone)}</a>` : "WhatsApp (no usable phone number)"} &nbsp;|&nbsp; ${S.client.email ? `<a href="${esc(mail)}">Email ${esc(S.client.email)}</a>` : "Email (no email address)"}</div>`;
}
function printQuote() { if (!QP) return; const pr = document.getElementById("print"); pr.className = "q"; pr.innerHTML = QP.pages.map(cv => `<img src="${cv.toDataURL("image/jpeg", 0.9)}">`).join(""); setTimeout(() => window.print(), 250); }
async function saveQuote() {
  const m = document.getElementById("qmsg"); if (!QP) return;
  if (!S.job) { m.innerHTML = `<div class="note">This client has no folder yet. Go back to the first screen and make it.</div>`; return; }
  m.innerHTML = `<div class="hint">Saving the PDF to the client folder...</div>`;
  try {
    const r = await (await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ job: S.job.job_id, t: S.job.token, action: "shopquote", pdf: await HWXQuote.b64(HWXQuote.pdf(QP.pages)) }) })).json();
    if (!r.ok) throw new Error(r.error || "server said no");
    m.innerHTML = `<div class="ok">Saved as "${esc(r.name)}" in ${esc(S.job.folder_name)} / 00 Most up to date information packs.</div>`;
  } catch (e) { m.innerHTML = `<div class="note">Could not save (${esc(e.message)}). Download the PDF instead.</div>`; }
}
async function saveFolder() {
  const m = document.getElementById("hmsg");
  if (!S.job) { m.innerHTML = `<div class="note">This client has no folder yet. Go back to the first screen and make it.</div>`; return; }
  m.innerHTML = `<div class="hint">Saving to the client folder...</div>`;
  try {
    const r = await (await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ job: S.job.job_id, t: S.job.token, action: "shopsave", csv: toCsv(), html: "<html><body>" + toHtml() + "</body></html>" }) })).json();
    if (!r.ok) throw new Error(r.error || "server said no");
    m.innerHTML = `<div class="ok">Saved in ${esc(S.job.folder_name)} / 00 Most up to date information packs (CSV${r.doc_ok ? " and a printable Google Doc" : ""}).</div>`;
  } catch (e) { m.innerHTML = `<div class="note">Could not save (${esc(e.message)}). Download the CSV instead.</div>`; }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go === "home") { location.href = "./"; return; }
  if (b.dataset.go) return nav(b.dataset.go);
  if (b.dataset.sw) return swSet(b.dataset.sw, b.dataset.v);
  if (b.dataset.swt) return swToggle(b.dataset.swt);
  if (b.dataset.pw) return pwAct(b.dataset.pw, b.dataset.v);
  if (b.dataset.staff) { S.staff = b.dataset.staff; save(); document.querySelectorAll("[data-staff]").forEach(x => x.classList.toggle("on", x === b)); return; }
  if (b.dataset.k) { readSpec(); S.inp[b.dataset.k] = b.dataset.v; save(); return vSpec(); }
  if (b.dataset.pick) { S.pick[b.dataset.pick] = +b.dataset.i; save(); return vList(); }
  if (b.dataset.cat) { if (b.dataset.cat === "pool") return nav("spec"); S.cat = b.dataset.cat; S.q = ""; S.zres = null; S.zmsg = ""; return nav("cat"); }
  if (b.dataset.zc) { S.steam.cold = b.dataset.zc; S.zres = null; S.zmsg = ""; save(); return vCat(); }
  if (b.dataset.spa) { S.spa[b.dataset.spa] = b.dataset.v; S.zmsg = ""; save(); return vCat(); }
  if (b.dataset.step) { addCode(b.dataset.code, +b.dataset.step, S.cat); return vCat(); }
  if (b.dataset.rm) { S.basket = S.basket.filter(x => x.id !== b.dataset.rm); save(); return vList(); }
  if (b.dataset.use != null) return folderChoice({ choice: "use", folder_id: (S.matches[+b.dataset.use] || {}).id });
  if (b.dataset.newfolder) return folderChoice({ choice: "new" });
  const a = b.dataset.act;
  if (a === "tolist") nav("list");
  else if (a === "more") nav("menu");
  else if (a === "addspa") addSpa();
  else if (a === "size") doSize();
  else if (a === "addsize") addSize();
  else if (a === "addsauna") addSauna();
  else if (a === "addpipe") addPipe();
  else if (a === "addcustom") addCustom();
  else if (a === "mkclient") mkClient();
  else if (a === "calc") calc();
  else if (a === "stock") refreshStock();
  else if (a === "csv") download();
  else if (a === "print") { handoff(); const pr = document.getElementById("print"); pr.className = "sheet"; pr.innerHTML = toHtml(); window.print(); }
  else if (a === "quote") nav("quote");
  else if (a === "qshare") sendQuote();
  else if (a === "qpdf") { if (QP) downloadBlob(HWXQuote.pdf(QP.pages), qName()); }
  else if (a === "qprint") printQuote();
  else if (a === "qsave") saveQuote();
  else if (a === "savefolder") saveFolder();
  else if (a === "newclient") { if (confirm("Start a new client? This list stays in the client's folder only if you saved it.")) { S = fresh(); save(); render(); } }
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.qty; if (k == null) return;
  const q = Math.max(0, Math.round(+e.target.value || 0));
  if (k.startsWith("b:")) { const it = S.basket.find(x => "b:" + x.id === k); if (it) { it.qty = q; if (!q) S.basket = S.basket.filter(x => x !== it); } save(); return vList(); }
  S.qty[k] = q; save(); vList();
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "sageRef") { S.sageRef = e.target.value; save(); }
  else if (id === "srch") { S.q = e.target.value; const el = document.getElementById("sres"); if (el) el.innerHTML = searchHtml(); }
  else if (id && /^sw_[WDH]$/.test(id)) swInput(id.slice(3), e.target.value);
  else if (id === "pw_m") pwInput("m", e.target.value);
  else if (id === "pw_rate") pwInput("rate", e.target.value);
  else if (id && id.startsWith("z_") && S[S.cat]) { S[S.cat][id.slice(2)] = e.target.value; save(); }
});

(function boot() {
  const p = new URLSearchParams(location.search), k = p.get("shop");
  if (k) { ls.set("hwx-shop-key", k); history.replaceState(null, "", location.pathname); }
  KEY = ls.get("hwx-shop-key") || "";
  S = ls.get("hwx-shop-session") || fresh();
  const f0 = fresh(); for (const k in f0) if (S[k] === undefined) S[k] = f0[k];   // sessions saved by an older version
  if ((S.view === "list" || S.view === "quote") && !S.res && !S.basket.length) S.view = "client";
  if ((S.view === "menu" || S.view === "cat") && !S.job) S.view = "client";
  if (S.view === "quote") S.view = "list";   // the stock list is not kept between visits: refresh it before quoting again
  S.stock = null;   // live prices are not kept between visits: refresh again
  render();
  if ("serviceWorker" in navigator) {
    const had = !!navigator.serviceWorker.controller;   // an update arrived while the old copy was open: reload once so staff always see the newest version
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && !window.__reloaded) { window.__reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(() => {});
  }
})();
</script>
